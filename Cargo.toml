[package]
name = "mezots"
version = "0.1.0"
edition = "2024"
description = "Zero-trust LAN peer-to-peer transport stack (mDNS + multicast discovery, TCP/WS transport, encrypted framed protocol)"

[dependencies]
# Phase 1 - discovery
mdns-sd = "0.6"
socket2 = { version = "0.5", features = ["all"] }

# Core async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
parking_lot = "0.12"

# Phase 2 - WebSocket endpoint for browser clients
axum = { version = "0.8", features = ["ws"] }

# Phase 3 - serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
base64 = "0.22"
bytes = "1"

# Phase 4 - cryptography
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2", features = ["zeroize"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.9"
subtle = "2"

# Observability + ergonomics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = "0.29"
